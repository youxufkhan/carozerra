name: Deploy web player

on:
  push:
    branches: [main]
    paths:
      - web/**
      - assets/**
      - CHANGELOG.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage shared assets into web/
        run: |
          mkdir -p web/clips
          cp assets/pioneer.png web/pioneer.png
          cp assets/clips/*.lkd web/clips/
          cp CHANGELOG.md web/CHANGELOG.md   # fetched at runtime by the in-page changelog modal

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
